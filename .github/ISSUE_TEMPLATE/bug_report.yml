name: Bug report
description: Something on VitaDB is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://vitadb.rinnegatamante.it/...
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Firefox 128 on Windows 11
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      description: Open your browser's DevTools console (F12) and paste anything relevant.
      render: text
    validations:
      required: false
