# VitaDB deploy hardening.
#
# Blocks direct browser/HTTP access to the deploy tooling, git metadata, and
# the config file. PHP's own include('config.php') on the server side is
# completely unaffected by this - it only blocks requests coming in over HTTP.

<DirectoryMatch "^/var/www/html/(deploy|\.git)(/|$)">
    Require all denied
</DirectoryMatch>

<Files "config.php">
    Require all denied
</Files>

<FilesMatch "\.env$">
    Require all denied
</FilesMatch>
