; VitaDB-specific PHP settings.

; The codebase uses old-style short PHP tags: <? ... ?>
short_open_tag = On

; Default upload limits (2M) are too small for homebrew screenshots/icons.
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

; Keep warnings/notices out of HTML responses. The app already suppresses
; most of these itself with error_reporting() calls; this backs it up.
display_errors = Off
log_errors = On
